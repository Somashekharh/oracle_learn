<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oracle Resources | Oracle Learn Platform</title>
    <meta name="description" content="Official Oracle and trusted learning references for Oracle database architecture, SQL, DBA operations, and Linux fundamentals." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/pages.css" />
    <link rel="stylesheet" href="assets/css/animations.css" />
  </head>
  <body class="page-resources">
    <div data-site-nav></div>
    <main>
      <section class="section page-hero">
        <div class="container">
          <p class="eyebrow">Learning References</p>
          <h1>Oracle DBA Reference Hub</h1>
          <p class="lead">
            Curated official Oracle documentation and trusted supporting resources for architecture, SQL processing,
            backup/recovery, performance, and Linux operations.
          </p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="card resources-toolbar reveal">
            <label class="sr-only" for="resource-search">Search references</label>
            <input id="resource-search" class="search-input" type="search" placeholder="Search docs, guides, and labs..." />
            <div id="resource-category-filters" class="filter-row" role="group" aria-label="Filter by category"></div>
            <div class="filter-row" role="group" aria-label="Filter by level">
              <button class="chip is-active" type="button" data-resource-level="all">All Levels</button>
              <button class="chip" type="button" data-resource-level="Beginner">Beginner</button>
              <button class="chip" type="button" data-resource-level="Intermediate">Intermediate</button>
              <button class="chip" type="button" data-resource-level="Advanced">Advanced</button>
            </div>
            <div class="resources-toolbar-actions">
              <button id="resource-random" class="btn btn-terminal" type="button">Pick Random Resource</button>
              <button id="resource-clear-bookmarks" class="btn btn-secondary" type="button">Clear Bookmarks</button>
            </div>
            <div class="resources-stats">
              <p id="resource-count" class="eyebrow">Loading resource catalog...</p>
              <p id="resource-bookmark-count" class="eyebrow">Bookmarked 0 resources</p>
            </div>
          </div>

          <div id="resource-grid" class="card-grid two-col"></div>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <article class="card reveal">
            <h2>Bookmarked References</h2>
            <div id="resource-bookmarks" class="resource-bookmark-list"></div>
          </article>
        </div>
      </section>
    </main>
    <div data-site-footer></div>
    <script type="module" src="assets/js/main.js"></script>
    <script type="module" src="assets/js/features/resources.js"></script>
  </body>
</html>
